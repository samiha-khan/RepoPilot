name: Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: repofix_test
          POSTGRES_USER: repofix
          POSTGRES_PASSWORD: repofix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repofix -d repofix_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://repofix:repofix@localhost:5432/repofix_test
      TEST_DATABASE_URL: postgresql+psycopg://repofix:repofix@localhost:5432/repofix_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests
